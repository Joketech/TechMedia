  <main class="page">
    <p class="small-title">CONTACT US</p>
    <h1>Tell us about your next story.</h1>
    <p class="intro">Send us your project details and we will get in touch.</p>

    <section class="section form-section">
      <form action="mailto:hello@techmediafilms.example" method="post" enctype="text/plain">
        <label for="name">Your Name</label>
        <input id="name" name="name" type="text" required>

        <label for="email">Email Address</label>
        <input id="email" name="email" type="email" required>

        <label for="message">Project Details</label>
        <textarea id="message" name="message" rows="6" required></textarea>

        <button class="button" type="submit">Send Message</button>
      </form>
    </section>
  </main>
